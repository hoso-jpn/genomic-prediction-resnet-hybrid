# CUDA実行環境の依存関係（CPU既定環境とは独立して固定する）
#
# ルートの pyproject.toml / uv.lock は PyTorch を CPU index へ固定しており、
# CIとDockerの既定経路はそちらを使う。GPU比較実験用の環境をそこへ混ぜると
# 既定のCPU経路の再現性が変わるため、CUDA版は本ディレクトリの
# pyproject.toml / uv.lock で別に固定する。
#
# バージョンの対応:
#   torch 2.2.1+cu121 / cu121 wheel（CUDA 12.1 runtime、cuDNN 8）
#   NVIDIA driver は CUDA 12.x のminor version compatibilityにより
#   >= 525.60.13 が必要（実機での確認は docs/gpu-verification.md を参照）。
#
# 数値計算まわり（numpy / pandas / scikit-learn / scipy）はルートと同一の
# ピン留めにして、CPU実行とGPU実行の比較で依存差が出ないようにする。
[project]
name = "genomic-prediction-resnet-hybrid-cuda"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "numpy==1.26.4",
    "pandas==3.0.3",
    "scikit-learn==1.8.0",
    "scipy>=1.17.1",
    "torch==2.2.1",
    "torch-geometric==2.7.0",
    "wandb==0.27.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
