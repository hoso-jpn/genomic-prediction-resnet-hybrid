services:

  # 生データ → processed_data_hy/ に変換
  preprocess:
    build: .
    volumes:
      - ./data:/workspace/data:ro
      - ./processed_data_hy:/workspace/processed_data_hy
    command: python3 preprocess.py

  # 学習（CPU モード）
  train:
    build: .
    volumes:
      - ./data:/workspace/data:ro
      - ./processed_data_hy:/workspace/processed_data_hy
      - ./wandb:/workspace/wandb
    env_file: .env
    command: python3 main.py

  # 学習（GPU モード）: NVIDIA Container Toolkit が必要
  # 使い方: docker compose run --rm train-gpu
  train-gpu:
    build: .
    volumes:
      - ./data:/workspace/data:ro
      - ./processed_data_hy:/workspace/processed_data_hy
      - ./wandb:/workspace/wandb
    env_file: .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: python3 main.py

  # W&B Sweep エージェント
  # 使い方:
  #   1. スイープ登録: docker compose run --rm sweep-init
  #      → 表示された SWEEP_ID を .env の SWEEP_ID に記載
  #   2. エージェント起動: docker compose run --rm sweep-agent
  sweep-init:
    build: .
    volumes:
      - ./wandb:/workspace/wandb
    env_file: .env
    command: wandb sweep sweep_config.yaml

  sweep-agent:
    build: .
    volumes:
      - ./data:/workspace/data:ro
      - ./processed_data_hy:/workspace/processed_data_hy
      - ./wandb:/workspace/wandb
    env_file: .env
    command: sh -c "wandb agent --count 30 $$SWEEP_ID"

  # LOFO-CV GBLUP ベースライン（R/sommer 使用）
  # 使い方: docker compose run --rm gblup-baseline
  # 実行時間の目安: 60〜120 分
  gblup-baseline:
    build: .
    volumes:
      - ./data:/workspace/data:ro
      - ./processed_data_hy:/workspace/processed_data_hy
      - ./wandb:/workspace/wandb
    env_file: .env
    command: python3 gblup_baseline.py

  # 対話的な開発・デバッグ用シェル
  dev:
    build: .
    volumes:
      - ./data:/workspace/data:ro
      - ./processed_data_hy:/workspace/processed_data_hy
      - ./wandb:/workspace/wandb
      - .:/workspace
    env_file: .env
    stdin_open: true
    tty: true
    command: bash
