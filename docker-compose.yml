services:

  # ---------------------------------------------------------------------
  # 検証済み経路（uv.lockベースのイメージ、profile指定なし＝既定で起動対象）
  # ---------------------------------------------------------------------

  # 単体テスト（tests/test_cpu_smoke.py を除く）
  # 外部データ・GPU・.env・W&B API keyは不要。bind mountも不要。
  unit-test:
    build: .
    command: pytest -q --ignore=tests/test_cpu_smoke.py

  # ResNet CLIと出力契約をsyntheticデータで検証するCPU smoke test
  # 外部データ・GPU・.env・W&B API keyは不要。bind mountも不要。
  cpu-smoke:
    build: .
    environment:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    command: pytest -q tests/test_cpu_smoke.py

  # GBLUP ベースライン（実データ利用者向けの手動実行経路）
  # data/ はread-only、結果ディレクトリのみ書き込み可能。CIでは実行しない。
  # W&Bは既定（--wandb-mode disabled）で初期化しないため、API keyも
  # WANDB_MODE環境変数も不要。offline/onlineにする場合はcommandへ
  # --wandb-mode を明示的に追加する。
  gblup:
    build: .
    profiles: ["real-data"]
    volumes:
      - ./data:/workspace/data:ro
      - ./gblup_results:/workspace/gblup_results
    command: >
      python gblup_baseline.py
      --data-dir data
      --output-dir gblup_results
      --expected-families 16

  # ResNet ベースライン（実データ利用者向けの手動実行経路）
  # data/ はread-only、結果ディレクトリのみ書き込み可能。CIでは実行しない。
  resnet:
    build: .
    profiles: ["real-data"]
    volumes:
      - ./data:/workspace/data:ro
      - ./resnet_results:/workspace/resnet_results
    command: >
      python resnet_baseline.py
      --data-dir data
      --output-dir resnet_results
      --device cpu

  # ---------------------------------------------------------------------
  # GPU経路（CUDAイメージ。profile "gpu" を明示した場合のみ起動する）
  #
  # Dockerfile.cuda / cuda/uv.lock で固定した独立環境（torch 2.12.1+cu130）を
  # 使う。対象GPUは compute capability 12.0（RTX 5090 等）で、ホストには
  # NVIDIA driver >= 580.65.06 と NVIDIA Container Toolkit が必要。
  # CIでは実行しない（GPU runnerが無いため）。実機での確認状況は
  # docs/gpu-verification.md。
  # ---------------------------------------------------------------------

  # syntheticな3家系でCUDA上のforward/backwardとLOFOを確認するsmoke test
  # GPRH_REQUIRE_CUDA=1 により、GPUが見えない場合はskipではなく失敗する。
  gpu-smoke:
    build:
      context: .
      dockerfile: Dockerfile.cuda
    profiles: ["gpu"]
    environment:
      GPRH_REQUIRE_CUDA: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: pytest -q tests/test_gpu_smoke.py

  # 検証済みResNetをCUDAで実行する経路（実データ、手動実行）
  # --device cuda はCUDA不在時に明確に失敗し、CPUへ黙って切り替わらない。
  resnet-gpu:
    build:
      context: .
      dockerfile: Dockerfile.cuda
    profiles: ["gpu"]
    volumes:
      - ./data:/workspace/data:ro
      - ./resnet_results:/workspace/resnet_results
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      python resnet_baseline.py
      --data-dir data
      --output-dir resnet_results
      --device cuda

  # ResNet（CPU実行）を同一のCUDAイメージで実行する経路
  # CPU実行とGPU実行の比較でtorchのバージョンまで揃えるための経路。
  # 既定のCPUイメージ（torch 2.2.1）とはtorchが異なるため、CPU/GPUを
  # 直接比較する場合はこちらを使う。GPUの割当は不要。
  resnet-cpu-cuda-env:
    build:
      context: .
      dockerfile: Dockerfile.cuda
    profiles: ["gpu"]
    volumes:
      - ./data:/workspace/data:ro
      - ./resnet_results:/workspace/resnet_results
    environment:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    command: >
      python resnet_baseline.py
      --data-dir data
      --output-dir resnet_results
      --device cpu

  # GBLUP（CPU実行）を同一のCUDAイメージで実行する経路
  # GPU比較でGBLUP側の数値計算依存が変わらないようにするため、同じ
  # イメージ・同じlockでCPU実行する。GPUの割当は不要。
  gblup-cuda-env:
    build:
      context: .
      dockerfile: Dockerfile.cuda
    profiles: ["gpu"]
    volumes:
      - ./data:/workspace/data:ro
      - ./gblup_results:/workspace/gblup_results
    command: >
      python gblup_baseline.py
      --data-dir data
      --output-dir gblup_results
      --expected-families 16

  # ---------------------------------------------------------------------
  # legacy / experimental経路（検証済みベースラインではない。既定では起動しない）
  #
  # preprocess.py / main.py / train_gnn.py は --allow-legacy が無い限り
  # 起動時に終了する。以下のサービス定義には意図的に --allow-legacy を
  # 含めていないため、--profile legacy を指定しただけではこの確認を
  # 迂回できない。legacyを実行する場合は、コマンドを明示的に上書きする:
  #
  #   docker compose --profile legacy run --rm train \
  #     python3 main.py --allow-legacy
  #
  # legacy許可とW&B送信許可は別。W&Bへ記録する場合は
  # --wandb-mode offline / online も明示的に追加する（既定は無効）。
  # ---------------------------------------------------------------------

  # 生データ → processed_data_hy/ に変換
  preprocess:
    build: .
    profiles: ["legacy"]
    volumes:
      - ./data:/workspace/data:ro
      - ./processed_data_hy:/workspace/processed_data_hy
    command: python3 preprocess.py

  # 学習（CPU モード）
  train:
    build: .
    profiles: ["legacy"]
    volumes:
      - .:/workspace
      - ./data:/workspace/data:ro
      - ./processed_data_hy:/workspace/processed_data_hy
      - ./wandb:/workspace/wandb
    env_file: .env
    command: python3 main.py

  # 学習（GPU モード）: NVIDIA Container Toolkit が必要
  train-gpu:
    build: .
    profiles: ["legacy"]
    volumes:
      - ./data:/workspace/data:ro
      - ./processed_data_hy:/workspace/processed_data_hy
      - ./wandb:/workspace/wandb
    env_file: .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: python3 main.py

  # W&B Sweep エージェント
  sweep-init:
    build: .
    profiles: ["legacy"]
    volumes:
      - ./wandb:/workspace/wandb
    env_file: .env
    command: wandb sweep sweep_config.yaml

  sweep-agent:
    build: .
    profiles: ["legacy"]
    volumes:
      - ./data:/workspace/data:ro
      - ./processed_data_hy:/workspace/processed_data_hy
      - ./wandb:/workspace/wandb
    env_file: .env
    command: sh -c "wandb agent --count 30 $$SWEEP_ID"

  # 旧GBLUPベースライン実行サービス（R/sommer時代のDockerfileを前提とした定義）
  gblup-baseline:
    build: .
    profiles: ["legacy"]
    volumes:
      - ./data:/workspace/data:ro
      - ./processed_data_hy:/workspace/processed_data_hy
      - ./wandb:/workspace/wandb
    env_file: .env
    command: python3 gblup_baseline.py

  # 対話的な開発・デバッグ用シェル
  dev:
    build: .
    profiles: ["legacy"]
    security_opt:
      - seccomp:unconfined
    volumes:
      - .:/workspace
      - ./data:/workspace/data:ro
      - ./processed_data_hy:/workspace/processed_data_hy
      - ./wandb:/workspace/wandb
    env_file: .env
    stdin_open: true
    tty: true
    command: bash

  # 転移学習用の擬似的な重みを作成
  create-weights:
    build: .
    profiles: ["legacy"]
    volumes:
      - .:/workspace
    command: python3 create_dummy_pretrained_weights.py

  # GNN用の擬似的なグラフデータを作成
  create-graph-data:
    build: .
    profiles: ["legacy"]
    volumes:
      - .:/workspace
    command: python3 create_dummy_graph_data.py

  # GNNモデルの訓練
  train-gnn:
    build: .
    profiles: ["legacy"]
    volumes:
      - .:/workspace
    env_file: .env
    command: python3 train_gnn.py
