services:

  # 生データ → processed_data_hy/ に変換
  preprocess:
    build: .
    volumes:
      - ./data:/workspace/data:ro
      - ./processed_data_hy:/workspace/processed_data_hy
    command: python3 preprocess.py

  # 学習（CPU モード）
  train:
    build: .
    volumes:
      - .:/workspace
      - ./data:/workspace/data:ro
      - ./processed_data_hy:/workspace/processed_data_hy
      - ./wandb:/workspace/wandb
    env_file: .env
    command: python3 main.py

  # 学習（GPU モード）: NVIDIA Container Toolkit が必要
  train-gpu:
    build: .
    volumes:
      - ./data:/workspace/data:ro
      - ./processed_data_hy:/workspace/processed_data_hy
      - ./wandb:/workspace/wandb
    env_file: .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: python3 main.py

  # W&B Sweep エージェント
  sweep-init:
    build: .
    volumes:
      - ./wandb:/workspace/wandb
    env_file: .env
    command: wandb sweep sweep_config.yaml

  sweep-agent:
    build: .
    volumes:
      - ./data:/workspace/data:ro
      - ./processed_data_hy:/workspace/processed_data_hy
      - ./wandb:/workspace/wandb
    env_file: .env
    command: sh -c "wandb agent --count 30 $$SWEEP_ID"

  # GBLUP ベースライン
  gblup-baseline:
    build: .
    volumes:
      - ./data:/workspace/data:ro
      - ./processed_data_hy:/workspace/processed_data_hy
      - ./wandb:/workspace/wandb
    env_file: .env
    command: python3 gblup_baseline.py

  # 対話的な開発・デバッグ用シェル
  dev:
    build: .
    security_opt:
      - seccomp:unconfined
    volumes:
      - .:/workspace
      - ./data:/workspace/data:ro
      - ./processed_data_hy:/workspace/processed_data_hy
      - ./wandb:/workspace/wandb
    env_file: .env
    stdin_open: true
    tty: true
    command: bash

  # 転移学習用の擬似的な重みを作成
  create-weights:
    build: .
    volumes:
      - .:/workspace
    command: python3 create_dummy_pretrained_weights.py

  # GNN用の擬似的なグラフデータを作成
  create-graph-data:
    build: .
    volumes:
      - .:/workspace
    command: python3 create_dummy_graph_data.py

  # GNNモデルの訓練
  train-gnn:
    build: .
    volumes:
      - .:/workspace
    env_file: .env
    command: python3 train_gnn.py
