name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, unit tests, and CPU smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Synchronize dependencies
        run: uv sync --frozen --extra gblup --dev

      - name: Check formatting
        run: >
          uv run --frozen --extra gblup
          ruff format --check
          gblup_baseline.py
          resnet_baseline.py
          soynam_data.py
          run_manifest.py
          external_logging.py
          legacy_guard.py
          tests

      - name: Run Ruff
        run: >
          uv run --frozen --extra gblup
          ruff check
          gblup_baseline.py
          resnet_baseline.py
          soynam_data.py
          run_manifest.py
          external_logging.py
          legacy_guard.py
          tests

      - name: Run unit tests
        run: >
          uv run --frozen --extra gblup
          pytest -q --ignore=tests/test_cpu_smoke.py

      - name: Run CPU smoke test
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: >
          uv run --frozen --extra gblup
          pytest -q tests/test_cpu_smoke.py

  docker-smoke:
    name: Docker Compose build and smoke (verified path only)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build verified images (unit-test, cpu-smoke)
        run: docker compose build unit-test cpu-smoke

      - name: Run unit tests in container
        run: docker compose run --rm unit-test

      - name: Run CPU smoke test in container
        run: docker compose run --rm cpu-smoke

      - name: Verify source is present in the image without a bind mount
        run: >
          docker compose run --rm unit-test
          bash -c "test -f /workspace/soynam_data.py &&
          test -f /workspace/gblup_baseline.py &&
          test -f /workspace/resnet_baseline.py &&
          test -d /workspace/tests"

      - name: Verify the image does not depend on rpy2/R
        run: >
          docker compose run --rm unit-test
          python -c "import importlib.util, sys;
          sys.exit(0 if importlib.util.find_spec('rpy2') is None else 1)"
